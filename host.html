<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footy Legends Pub — Host</title>
<style>
  :root { --bg:#0a0f0a; --panel:#0f1710; --gold:#e9c46a; --green:#39d353; --text:#d8d8d8; --dim:#8a8576; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Courier New",monospace; padding:24px; }
  h1 { color:var(--gold); letter-spacing:2px; font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:24px; }
  button { background:var(--gold); color:#111; border:0; padding:14px 22px; font-family:inherit; font-size:15px; letter-spacing:2px; cursor:pointer; border-radius:6px; }
  .code { font-size:64px; letter-spacing:12px; color:var(--gold); font-weight:bold; margin:8px 0; }
  .card { background:var(--panel); border:1px solid #223; border-radius:10px; padding:24px; max-width:520px; }
  #qr { background:#fff; padding:12px; border-radius:8px; display:inline-block; margin-top:12px; min-height:40px; }
  #qr img { display:block; }
  .teams { margin-top:24px; }
  .team { background:#132013; border:1px solid #2a4; border-radius:8px; padding:12px 16px; margin-bottom:8px; font-size:16px; }
  .count { color:var(--green); letter-spacing:2px; font-size:13px; margin-bottom:8px; }
  .hint { color:var(--dim); font-size:12px; margin-top:16px; line-height:1.6; word-break:break-all; }
</style>
</head>
<body>
  <h1>FOOTY LEGENDS · HOST</h1>
  <div class="sub">Spine test — create a room, let phones join.</div>

  <!-- ===== BRAMA LOGOWANIA (Etap 1: tylko zalogowany host tworzy gre) ===== -->
  <div id="auth" class="card" style="display:none;max-width:420px">
    <div class="sub" style="margin-bottom:16px">HOST LOGIN</div>
    <input id="auth-email" type="email" placeholder="email" autocomplete="username"
           style="width:100%;padding:14px;margin-bottom:10px;font-family:inherit;font-size:15px;background:#132013;border:1px solid #2a4;color:var(--text);border-radius:6px;box-sizing:border-box">
    <input id="auth-pass" type="password" placeholder="password" autocomplete="current-password"
           style="width:100%;padding:14px;margin-bottom:14px;font-family:inherit;font-size:15px;background:#132013;border:1px solid #2a4;color:var(--text);border-radius:6px;box-sizing:border-box">
    <button id="auth-btn" style="width:100%;background:var(--gold);color:#111;border:0;padding:14px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:6px">LOG IN</button>
    <div class="hint" id="auth-err" style="color:#e2554a;min-height:1.2em"></div>
  </div>

  <!-- pasek wylogowania (widoczny gdy zalogowany) -->
  <div id="whoami" class="hint" style="display:none;margin-bottom:12px">
    <span id="whoami-email"></span> ·
    <a href="#" id="logout" style="color:var(--gold)">log out</a>
  </div>

  <div id="start" class="card" style="display:none">
    <button id="newgame">NEW GAME</button>
    <div class="hint">Click to create a room. A code + QR will appear. Phones scan the QR (or open the link) to join.</div>
  </div>

  <div id="live" class="card" style="display:none">
    <div class="sub">ROOM CODE</div>
    <div id="code" class="code"></div>
    <div id="qr"></div>
    <div id="tvbar" style="display:flex;gap:10px;margin-top:14px">
      <button id="opentv" style="flex:1;background:#132013;color:var(--gold);border:1px solid var(--gold);padding:14px;font-family:inherit;font-size:14px;letter-spacing:1px;cursor:pointer;border-radius:6px">&#128250; OPEN TV</button>
      <button id="copytv" style="flex:1;background:#132013;color:#39d353;border:1px solid #2a4;padding:14px;font-family:inherit;font-size:14px;letter-spacing:1px;cursor:pointer;border-radius:6px">&#128279; COPY TV LINK</button>
    </div>
    <div class="teams">
      <div id="count" class="count">TEAMS · 0</div>
      <div id="teamlist"></div>
    </div>
    <div id="startbar" style="margin-top:20px;display:none">
      <button id="startbtn" style="width:100%;background:var(--gold);color:#111;border:0;padding:16px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:6px">▶ START GAME</button>
    </div>
    <div id="skipbar" style="margin-top:14px;display:none;text-align:center">
      <!-- Hit-area TYLKO na przycisku (nie full-width) — chroni przed przypadkowym tapem na telefonie -->
      <button id="skipbtn" style="display:inline-block;width:auto;min-width:160px;max-width:280px;background:linear-gradient(180deg,#f4d788,#e9c46a);color:#111;border:0;padding:14px 22px;font-family:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;border-radius:8px;box-shadow:0 3px 0 #b8963f">&#9197; SKIP</button>
    </div>
    <div id="roundinfo" class="count" style="margin-top:20px;display:none"></div>
    <div id="stepbar" style="margin-top:14px;display:none">
      <button id="stepbtn" style="width:100%;background:linear-gradient(180deg,#f4d788,#e9c46a);color:#111;border:0;padding:34px 16px;font-family:inherit;font-size:22px;letter-spacing:3px;cursor:pointer;border-radius:10px;box-shadow:0 4px 0 #b8963f">&#9654; NEXT REVEAL</button>
    </div>
    <div id="nextbar" style="margin-top:14px;display:none">
      <button id="nextbtn" style="width:100%;background:#39d353;color:#0a0f0a;border:0;padding:16px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:6px">&#9654; NEXT ROUND</button>
    </div>
    <div id="revealbar" style="margin-top:14px;display:none">
      <button id="revealbtn" style="width:100%;background:#e2554a;color:#fff;border:0;padding:16px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:6px">&#9733; REVEAL RESULTS</button>
    </div>
    <div id="tablebar" style="margin-top:14px;display:none">
      <button id="tablebtn" style="width:100%;background:#132013;color:#39d353;border:1px solid #2a4;padding:16px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:6px">&#128203; TITLES TABLE</button>
    </div>
    <div id="endbar" style="margin-top:14px;display:none">
      <button id="endbtn" style="width:100%;background:#2a1f10;color:var(--gold);border:1px solid var(--gold);padding:16px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:6px">&#127937; END TONIGHT</button>
    </div>
    <div id="newnightbar" style="margin-top:16px;display:none">
      <button id="newnightbtn" style="width:100%;background:var(--gold);color:#111;border:0;padding:18px;font-family:inherit;font-size:15px;letter-spacing:2px;cursor:pointer;border-radius:6px;box-shadow:0 4px 0 #b8963f">&#127916; NEW NIGHT</button>
    </div>
    <div class="hint" id="joinlink"></div>
    <div class="hint">&#9888; Phones must join THIS code. Clicking NEW GAME again starts a fresh, empty room.</div>
  </div>

  <!-- OKNO POTWIERDZENIA w stylu Footy Legends (zamiast systemowego confirm) -->
  <div id="modal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(4,10,5,.86);align-items:center;justify-content:center;padding:20px">
    <div style="max-width:460px;width:100%;background:linear-gradient(180deg,#101a10,#0a120a);border:2px solid var(--gold);border-radius:12px;padding:26px 22px;box-shadow:0 0 40px rgba(233,196,106,.25)">
      <div id="mo-title" style="color:var(--gold);font-size:15px;letter-spacing:3px;text-align:center"></div>
      <div id="mo-body" style="color:#cfcabb;font-size:11px;line-height:2;letter-spacing:1px;margin-top:18px;text-align:center"></div>
      <div style="display:flex;gap:10px;margin-top:24px">
        <button id="mo-no" style="flex:1;background:#132013;color:#9a9484;border:1px solid #2a4;padding:15px;font-family:inherit;font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:6px">CANCEL</button>
        <button id="mo-yes" style="flex:1;background:var(--gold);color:#111;border:0;padding:15px;font-family:inherit;font-size:13px;letter-spacing:2px;cursor:pointer;border-radius:6px">CONFIRM</button>
      </div>
    </div>
  </div>

  <script src="qr.js"></script>   <!-- generator QR LOKALNIE (MIT, Kazuhiko Arase) -->
  <script src="supabase.js"></script>   <!-- Supabase LOKALNIE (MIT) — bez obcego CDN -->
  <script>
    // ===== CONFIG (same three lines in host / join / display) =====
    const SUPABASE_URL = "https://wrvbpxeuadalnflfygtk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DGcYVJ4eJWbrqmNSgyRQtA_49yrqbnp";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // ===== helpers =====
    function baseUrl(){ return location.origin + location.pathname.replace(/\/[^\/]*$/, ""); }
    function makeCode(){ const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }
    function safe(t){ const d=document.createElement("div"); d.textContent = t==null ? "" : String(t); return d.innerHTML; }

    let roomId = null;
    let roomStatus = null;   // ostatni znany status pokoju (do ochrony NEW GAME)
    let roomCode = null;
    let started = false;
    let currentRound = 0;
    document.getElementById("newgame").onclick = createRoom;
    // po zakonczeniu wieczoru: swieza gra bez odswiezania strony
    document.getElementById("newnightbtn").onclick = resetGame;   // reset w miejscu (staly link); join.html sprawdza teraz czy druzyna istnieje
    document.getElementById("startbtn").onclick = startGame;

    async function startGame(){
      if (!roomId || started) return;
      const btn = document.getElementById("startbtn");
      btn.disabled = true; btn.textContent = "STARTING…";
      // BEZPIECZNIK: jak Supabase zawiśnie (bez błędu, po prostu nie odpowiada), odblokuj przycisk po 10s
      // zamiast zostawiac "STARTING…" na zawsze (dawniej ratowal tylko refresh).
      let done = false;
      const failsafe = setTimeout(function(){ if (!done && !started){ btn.disabled=false; btn.textContent="▶ START GAME"; } }, 10000);
      try {
        const { error: rErr } = await db.from("rounds").insert({ room_id: roomId, round_number: 1, theme: "england", status: "rolling" });
        if (rErr) throw new Error("Round: " + rErr.message);
        const { error: uErr } = await db.from("rooms").update({ status: "playing", current_round: 1 }).eq("id", roomId);
        if (uErr) throw new Error("Room: " + uErr.message);
        done = true; clearTimeout(failsafe);
        started = true; currentRound = 1;
        paintButtons("playing");
      } catch(err){
        done = true; clearTimeout(failsafe);
        btn.disabled = false; btn.textContent = "▶ START GAME";
        alert("Couldn't start: " + (err.message || err));
      }
    }

    // ile kart pokazuje TV w tej rundzie (<=5 druzyn = wszyscy, 6+ = TOP 3)
    let revealStep = 0;
    let showCount  = 0;
    // ile druzyn gra i ile juz zalockowalo w biezacej rundzie
    // AUTO-REVEAL: gdy wszystkie GRAJACE druzyny zalockuja (albo minie deadline draftu) -> reveal SAM, bez klikania.
    // Puste sloty z lobby / nieobecni: wykluczeni przez deadline (nie blokuja). SKIP dalej przepycha wczesniej.
    let autoRevealing = false;
    async function doReveal(){   // sam zapis reveal, bez confirm (uzywane przez auto-reveal)
      revealStep = 0;
      await loadRankCount();
      const { error } = await db.from("rooms").update({ status:"reveal", reveal_step:0 }).eq("id", roomId);
      if (error){ console.error("auto-reveal:", error.message); return; }
      paintButtons("reveal");
    }
    async function maybeAutoReveal(){
      if (!roomId || roomStatus !== "playing" || autoRevealing) return;
      const st = await lockStats();               // teams = nie-spectator; locked = wpisy tej rundy
      if (st.locked < 1) return;                  // nic do odsloniecia
      let go = (st.locked >= st.teams);           // wszyscy grajacy zalockowali -> reveal od razu
      if (!go){
        // wyklucz PUSTE SLOTY: po deadline draftu odslon z tym, co jest (nieobecni = 0, nie blokuja)
        const { data: rd } = await db.from("rounds").select("id").eq("room_id", roomId).eq("round_number", currentRound).maybeSingle();
        if (rd){
          const { data: e } = await db.from("entries").select("locked_at").eq("round_id", rd.id).order("locked_at",{ ascending:true }).limit(1);
          if (e && e[0] && e[0].locked_at){
            const deadline = new Date(e[0].locked_at).getTime() + 90000;   // TIMER_SECONDS=90, jak telefon/TV
            if (Date.now() > deadline + 1500) go = true;
          }
        }
      }
      if (go && roomStatus === "playing" && !autoRevealing){
        autoRevealing = true;
        try { await doReveal(); } finally { autoRevealing = false; }
      }
    }

    async function lockStats(){
      const out = { teams:0, locked:0 };
      const { data: ts } = await db.from("teams").select("id,role").eq("room_id", roomId);
      out.teams = (ts || []).filter(function(t){ return t.role !== "spectator"; }).length;
      const { data: rd } = await db.from("rounds").select("id").eq("room_id", roomId).eq("round_number", currentRound).maybeSingle();
      if (rd){
        const { data: es } = await db.from("entries").select("team_id").eq("round_id", rd.id);
        out.locked = (es || []).length;
      }
      return out;
    }

    async function loadRankCount(){
      showCount = 0;
      const { data: rd } = await db.from("rounds").select("id").eq("room_id", roomId).eq("round_number", currentRound).maybeSingle();
      if (!rd) return;
      const { data: es } = await db.from("entries").select("score").eq("round_id", rd.id);
      const n = (es || []).filter(function(e){ return e.score != null; }).length;
      showCount = (n <= 5) ? n : 3;
    }
    function ordinal(n){ return n===1 ? "THE WINNER" : (n===2 ? "2ND PLACE" : (n===3 ? "3RD PLACE" : n+"TH PLACE")); }
    function paintStep(){
      const bar = document.getElementById("stepbar");
      const btn = document.getElementById("stepbtn");
      const nextPlace = showCount - revealStep;     // miejsce, ktore odsloni NASTEPNY klik
      if (nextPlace <= 0){ bar.style.display = "none"; return; }  // zwyciezca juz odsloniety
      btn.disabled = false;
      // pierwszy klik przy 4+ druzynach schodzi z tablicy na 3. miejsce
      btn.innerHTML = "&#9654; REVEAL " + ordinal(nextPlace);
      bar.style.display = "";
    }
    document.getElementById("stepbtn").onclick = async function(){
      if (!roomId) return;
      const btn = document.getElementById("stepbtn");
      btn.disabled = true; btn.innerHTML = "REVEALING\u2026";
      revealStep++;
      const { error } = await db.from("rooms").update({ reveal_step: revealStep }).eq("id", roomId);
      if (error){ alert("Step error: " + error.message); revealStep--; btn.disabled = false; return; }
      paintButtons("reveal");   // po zwyciezcy pokaze NEXT ROUND / TABLE / END
    };

    // ETAP A slice 2: SKIP — jeden przycisk, dyspozytor wg stanu, reuzywa istniejace funkcje (zero nowych stanow)
    document.getElementById("skipbtn").onclick = async function(){
      if (!roomId) return;
      if (roomStatus === "playing"){ await revealRound(); }        // draft -> reveal (z guardem "nie wszyscy zalockowali")
      else if (roomStatus === "reveal"){ await showTitles(); }     // reveal -> tabela (przeskok)
      else if (roomStatus === "table"){ await nextRound(); }       // tabela -> nastepna runda
    };

    document.getElementById("revealbtn").onclick = revealRound;
    async function revealRound(){
      if (!roomId) return;
      const btn = document.getElementById("revealbtn");
      // OCHRONA: nie odslaniaj, gdy nikt nie zalockowal (kiedys to rozwalalo cala petle)
      const st = await lockStats();
      if (st.locked < 1){
        await askConfirm("\u26A0 NOBODY HAS LOCKED IN",
          "No team has locked their XI yet.<br>There is nothing to reveal.<br><br>Wait for at least one team.",
          "OK");
        return;
      }
      if (st.locked < st.teams){
        const brak = st.teams - st.locked;
        const ok = await askConfirm("\u26A0 NOT EVERYONE IS READY",
          brak + " of " + st.teams + " teams haven't locked in.<br>They will score 0 for this round.<br><br>Reveal anyway?",
          "REVEAL ANYWAY");
        if (!ok) return;
      }
      btn.disabled = true; btn.textContent = "REVEALING…";
      revealStep = 0;
      await loadRankCount();
      const { error } = await db.from("rooms").update({ status: "reveal", reveal_step: 0 }).eq("id", roomId);
      if (error){ alert("Reveal error: " + error.message); btn.disabled=false; btn.textContent="★ REVEAL RESULTS"; return; }
      paintButtons("reveal");
    }

    document.getElementById("tablebtn").onclick = showTitles;
    async function showTitles(){
      if (!roomId) return;
      const btn = document.getElementById("tablebtn");
      btn.disabled = true; btn.textContent = "SHOWING…";
      const { error } = await db.from("rooms").update({ status: "table" }).eq("id", roomId);
      if (error){ alert("Table error: " + error.message); btn.disabled=false; btn.innerHTML="&#128203; TITLES TABLE"; return; }
      paintButtons("table");
    }

    // Okno potwierdzenia w stylu gry — zwraca Promise<boolean>, zastepuje confirm()
    function askConfirm(title, body, yesLabel){
      return new Promise(function(resolve){
        const m = document.getElementById("modal");
        document.getElementById("mo-title").textContent = title;
        document.getElementById("mo-body").innerHTML = body;
        document.getElementById("mo-yes").textContent = yesLabel || "CONFIRM";
        m.style.display = "flex";
        function done(v){ m.style.display = "none"; document.onkeydown = null; resolve(v); }
        document.getElementById("mo-yes").onclick = function(){ done(true); };
        document.getElementById("mo-no").onclick  = function(){ done(false); };
        document.onkeydown = function(e){ if (e.key === "Escape") done(false); };
      });
    }

    document.getElementById("endbtn").onclick = endTonight;
    async function endTonight(){
      if (!roomId) return;
      const ok = await askConfirm("\u{1F3C1} END THE NIGHT?",
        "The big screen will show the OVERALL TABLE<br>and the champions.<br><br>No more rounds after this.",
        "END TONIGHT");
      if (!ok) return;
      const btn = document.getElementById("endbtn");
      btn.disabled = true; btn.textContent = "ENDING…";
      const { error } = await db.from("rooms").update({ status: "ended" }).eq("id", roomId);
      if (error){ alert("End error: " + error.message); btn.disabled=false; btn.innerHTML="&#127937; END TONIGHT"; return; }
      try { localStorage.removeItem("fl_host_room"); } catch(e){}
      paintButtons("ended");
    }

    document.getElementById("nextbtn").onclick = nextRound;
    async function nextRound(){
      if (!roomId) return;
      const btn = document.getElementById("nextbtn");
      btn.disabled = true; btn.textContent = "STARTING…";
      const next = currentRound + 1;
      // 1) nowa runda
      const { error: rErr } = await db.from("rounds").insert({
        room_id: roomId, round_number: next, theme: "england", status: "rolling"
      });
      if (rErr){ alert("Round error: " + rErr.message); btn.disabled=false; btn.textContent="▶ NEXT ROUND"; return; }
      // 2) pokoj z powrotem w tryb gry
      const { error: uErr } = await db.from("rooms").update({ status: "playing", current_round: next }).eq("id", roomId);
      if (uErr){ alert("Room error: " + uErr.message); btn.disabled=false; btn.textContent="▶ NEXT ROUND"; return; }
      currentRound = next;
      paintButtons("playing");
    }

    async function createRoom(){
      // ochrona przed przypadkowym klikiem w trakcie wieczoru — pyta TYLKO gdy gra trwa
      if (roomId && roomStatus && roomStatus !== "ended"){
        const ok = await askConfirm("\u26A0 A GAME IS RUNNING",
          "Starting a new game will ABANDON the current room.<br>Teams on their phones will be left behind.<br><br>Are you sure?",
          "START NEW ANYWAY");
        if (!ok) return;
      }
      const code = makeCode();
      const { data, error } = await db.from("rooms").insert({ code: code, status: "lobby" }).select().single();
      if (error){ alert("Could not create room: " + error.message); return; }
      enterRoom(data);
    }

    // NEW NIGHT = RESET W MIEJSCU: ten sam pokoj/kod/link. Czysci druzyny+rundy+wpisy, status->lobby.
    // TV (staly link) sam wraca do QR; barman nie robi nowego linku ("set and forget").
    async function resetGame(){
      if (!roomId) return;
      const ok = await askConfirm("\u{1F3B2} NEW NIGHT?",
        "This clears all teams and results from tonight.<br>Your TV link and QR stay <b>exactly the same</b>.<br><br>Start a fresh night?",
        "START NEW NIGHT");
      if (!ok) return;
      const btn = document.getElementById("newnightbtn");
      btn.disabled = true; btn.textContent = "RESETTING\u2026";
      try {
        const { data: rounds, error: qErr } = await db.from("rounds").select("id").eq("room_id", roomId);
        if (qErr) throw new Error("read rounds \u2013 " + qErr.message);
        const roundIds = (rounds || []).map(function(r){ return r.id; });
        if (roundIds.length){
          const { error } = await db.from("entries").delete().in("round_id", roundIds);
          if (error) throw new Error("entries \u2013 " + error.message);
        }
        { const { error } = await db.from("rounds").delete().eq("room_id", roomId); if (error) throw new Error("rounds \u2013 " + error.message); }
        { const { error } = await db.from("teams").delete().eq("room_id", roomId);   if (error) throw new Error("teams \u2013 " + error.message); }
        { const { error } = await db.from("rooms").update({ status:"lobby", current_round:1, reveal_step:0 }).eq("id", roomId); if (error) throw new Error("room \u2013 " + error.message); }
        // WERYFIKACJA: RLS potrafi CICHO skasowac 0 wierszy BEZ bledu -> upewnij sie ze druzyny naprawde znikly
        { const { data: leftT } = await db.from("teams").select("id").eq("room_id", roomId).limit(1);
          if (leftT && leftT.length){ throw new Error("teams \u2013 nie skasowane (RLS cicho zablokowal delete); potrzebna polityka DELETE dla hosta po room_id"); } }
        try { localStorage.setItem("fl_host_room", roomCode); } catch(e){}   // END mogl usunac klucz -> przywroc, by reload trafil w ten sam pokoj
        location.reload();   // czysty swiezy lobby z bazy (ten sam pokoj/kod/link), zero ducha starego stanu
      } catch(err){
        btn.disabled = false; btn.innerHTML = "&#127916; NEW NIGHT";
        await askConfirm("\u26A0 RESET BLOCKED",
          "Couldn't clear: <b>" + err.message + "</b><br><br>Almost certainly a database delete permission (RLS). Tell me the table name shown and I'll give you the one-line fix.",
          "OK");
      }
    }

    // wejscie w pokoj (nowy albo odtworzony po odswiezeniu strony)
    function enterRoom(room){
      roomId = room.id;
      roomCode = room.code;
      currentRound = room.current_round || 0;
      revealStep = room.reveal_step || 0;
      started = (room.status !== "lobby");
      if (room.status === "reveal") loadRankCount().then(paintStep);
      try { localStorage.setItem("fl_host_room", room.code); } catch(e){}

      document.getElementById("start").style.display = "none";
      document.getElementById("live").style.display = "block";
      document.getElementById("code").textContent = room.code;

      const link = baseUrl() + "/join.html?room=" + room.code;
      document.getElementById("joinlink").textContent = link;
      const qrBox = document.getElementById("qr");
      if (qrBox){
        qrBox.innerHTML = "";   // zawsze świeży QR (NEW GAME nie zostawia starego)
        try {
          // QR LOKALNIE (qr.js) — bez zewnetrznego serwisu, wiec nie padnie w trakcie wieczoru
          const q = qrcode(0, "M");
          q.addData(link);
          q.make();
          const img = document.createElement("img");
          img.width = 220; img.height = 220; img.alt = "QR to join";
          img.src = q.createDataURL(7, 8);
          qrBox.appendChild(img);
        } catch(e){ console.error("QR:", e); }
      }

      // link do TV z aktualnym kodem — OPEN TV otwiera, COPY TV LINK kopiuje
      const tvLink = baseUrl() + "/display.html?room=" + room.code;
      document.getElementById("opentv").onclick = function(){ window.open(tvLink, "_blank"); };
      document.getElementById("copytv").onclick = async function(){
        const btn = document.getElementById("copytv");
        try { await navigator.clipboard.writeText(tvLink); btn.innerHTML = "&#10003; COPIED"; }
        catch(e){ prompt("Copy the TV link:", tvLink); return; }
        setTimeout(function(){ btn.innerHTML = "&#128279; COPY TV LINK"; }, 1500);
      };

      paintButtons(room.status);

      loadTeams();
      try {
        db.channel("host-" + roomId)
          .on("postgres_changes", { event:"INSERT", schema:"public", table:"teams", filter:"room_id=eq."+roomId }, function(){ loadTeams(); })
          .subscribe();
      } catch(e){}
      setInterval(loadTeams, 2000);
      setInterval(maybeAutoReveal, 2000);   // AUTO-REVEAL: reveal sam gdy wszyscy grajacy zalockuja / po deadline
    }

    // ustaw przyciski wg stanu pokoju (dziala takze po odswiezeniu)
    function paintButtons(status){
      roomStatus = status;   // zapamietaj — createRoom sprawdza, czy gra trwa
      const ri = document.getElementById("roundinfo");
      const sb = document.getElementById("startbar");
      const rb = document.getElementById("revealbar");
      const nb = document.getElementById("nextbar");
      const eb = document.getElementById("endbar");
      const tb = document.getElementById("tablebar");
      const stp = document.getElementById("stepbar");
      const nnb = document.getElementById("newnightbar");
      sb.style.display = "none"; rb.style.display = "none"; nb.style.display = "none"; eb.style.display = "none"; tb.style.display = "none"; stp.style.display = "none";
      if (nnb) nnb.style.display = "none";
      // ETAP A slice 2: SKIP — jeden przycisk zamiast klikania reveal/table/next, opis wg stanu
      const _skb = document.getElementById("skipbar"), _skbtn = document.getElementById("skipbtn");
      if (status === "playing"){ _skbtn.disabled=false; _skbtn.innerHTML="&#9197; SKIP TO RESULTS"; _skb.style.display=""; }
      else if (status === "reveal"){ _skbtn.disabled=false; _skbtn.innerHTML="&#9197; SKIP TO TABLE"; _skb.style.display=""; }
      else if (status === "table"){ _skbtn.disabled=false; _skbtn.innerHTML="&#9197; NEXT ROUND"; _skb.style.display=""; }
      else { _skb.style.display="none"; }
      if (status === "ended"){
        ri.style.display = ""; ri.textContent = "\u{1F3C1} NIGHT ENDED \u00b7 OVERALL TABLE ON THE BIG SCREEN";
        if (nnb) nnb.style.display = "";     // wyjscie ze slepego zaulka — bez odswiezania strony
        return;
      }
      if (status === "lobby"){
        ri.style.display = "none";
      } else if (status === "playing"){
        ri.style.display = ""; ri.textContent = "● ROUND " + currentRound + " · IN PLAY";
        eb.style.display = "";   // reveal odpala sie sam / SKIP TO RESULTS; zostaje END TONIGHT
      } else if (status === "table"){
        ri.style.display = ""; ri.textContent = "\u{1F4CB} TITLES TABLE ON THE BIG SCREEN";
        eb.style.display = "";   // NEXT ROUND = SKIP; zostaje END TONIGHT
      } else if (status === "reveal"){
        ri.style.display = ""; ri.textContent = "\u25cf REVEALING ON THE BIG SCREEN";
        eb.style.display = "";   // reveal leci sam; SKIP TO TABLE gdy chcesz uciac
      }
    }

    // pelny zestaw: NEXT ROUND + TITLES TABLE + END TONIGHT (po zwyciezcy albo w tabeli)
    function showRoundControls(){
      const nx = document.getElementById("nextbtn");
      nx.disabled = false; nx.textContent = "▶ NEXT ROUND";
      document.getElementById("nextbar").style.display = "";
      const tt = document.getElementById("tablebtn");
      tt.disabled = false; tt.innerHTML = "&#128203; TITLES TABLE";
      document.getElementById("tablebar").style.display = "";
      const en = document.getElementById("endbtn");
      en.disabled = false; en.innerHTML = "&#127937; END TONIGHT";
      document.getElementById("endbar").style.display = "";
    }

    // ===== ETAP 1: brama logowania =====
    // pokaz panel hosta tylko zalogowanemu; niezalogowanemu pokaz ekran logowania.
    function showLoggedOut(){
      document.getElementById("auth").style.display = "";
      document.getElementById("whoami").style.display = "none";
      document.getElementById("start").style.display = "none";
      document.getElementById("live").style.display = "none";
    }
    function showLoggedIn(email){
      document.getElementById("auth").style.display = "none";
      document.getElementById("whoami").style.display = "";
      document.getElementById("whoami-email").textContent = email || "";
      document.getElementById("start").style.display = "";   // panel "NEW GAME"
      restoreGame();                                          // wroc do trwajacej gry (jesli jest)
    }

    // wroc do trwajacej gry po odswiezeniu (dziala tylko dla zalogowanego)
    async function restoreGame(){
      let code = null;
      try { code = localStorage.getItem("fl_host_room"); } catch(e){}
      if (!code) return;
      const { data } = await db.from("rooms").select("*").eq("code", code).maybeSingle();
      if (data && data.status !== "ended") enterRoom(data);
    }

    // logowanie email+haslo
    document.getElementById("auth-btn").onclick = async function(){
      const email = document.getElementById("auth-email").value.trim();
      const pass  = document.getElementById("auth-pass").value;
      const err   = document.getElementById("auth-err");
      const btn   = document.getElementById("auth-btn");
      err.textContent = "";
      if (!email || !pass){ err.textContent = "Enter email and password."; return; }
      btn.disabled = true; btn.textContent = "LOGGING IN…";
      const { data, error } = await db.auth.signInWithPassword({ email: email, password: pass });
      btn.disabled = false; btn.textContent = "LOG IN";
      if (error){ err.textContent = error.message; return; }
      document.getElementById("auth-pass").value = "";
      showLoggedIn(data.user && data.user.email);
    };
    // Enter w polu hasla = klik LOG IN
    document.getElementById("auth-pass").addEventListener("keydown", function(e){
      if (e.key === "Enter") document.getElementById("auth-btn").click();
    });

    // wylogowanie
    document.getElementById("logout").onclick = async function(e){
      e.preventDefault();
      try { localStorage.removeItem("fl_host_room"); } catch(err){}
      await db.auth.signOut();
      location.reload();
    };

    // start: sprawdz sesje (Supabase trzyma ja miedzy odswiezeniami)
    (async function bootAuth(){
      const { data } = await db.auth.getSession();
      if (data && data.session){ showLoggedIn(data.session.user && data.session.user.email); }
      else { showLoggedOut(); }
    })();

    async function loadTeams(){
      if (!roomId) return;
      const { data } = await db.from("teams").select("*").eq("room_id", roomId).order("created_at");
      const list = document.getElementById("teamlist");
      list.innerHTML = "";
      (data || []).forEach(function(t){
        const el = document.createElement("div");
        el.className = "team";
        el.innerHTML = "\u2713 " + safe(t.name);
        list.appendChild(el);
      });
      document.getElementById("count").textContent = "TEAMS \u00b7 " + (data ? data.length : 0);
      // pokaz START, gdy jest >=1 druzyna i gra jeszcze nie ruszyla
      const hasTeams = data && data.length > 0;
      document.getElementById("startbar").style.display = (hasTeams && !started) ? "" : "none";
    }
  </script>
</body>
</html>
