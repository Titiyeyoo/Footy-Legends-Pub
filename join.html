<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XI After Dark — Join</title>
<style>
  :root { --bg:#0a0f0a; --panel:#0f1710; --gold:#e9c46a; --green:#39d353; --text:#d8d8d8; --dim:#8a8576; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Courier New",monospace; padding:24px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
  h1 { color:var(--gold); letter-spacing:2px; font-size:18px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  input { width:100%; padding:16px; font-family:inherit; font-size:18px; background:#132013; border:1px solid #2a4; color:var(--text); border-radius:8px; }
  button { width:100%; margin-top:14px; background:var(--gold); color:#111; border:0; padding:16px; font-family:inherit; font-size:16px; letter-spacing:2px; cursor:pointer; border-radius:8px; }
  .code { color:var(--gold); letter-spacing:4px; }
  .ok { color:var(--green); font-size:20px; text-align:center; margin-top:20px; line-height:1.6; }
  .err { color:#e06; font-size:14px; }
  .backname { color:var(--gold); font-size:24px; letter-spacing:2px; text-align:center; margin:12px 0 22px; line-height:1.3; word-break:break-word; }
  #return a { color:var(--dim); }
</style>
</head>
<body>
  <h1>XI AFTER DARK · JOIN</h1>
  <div class="sub" id="roomline"></div>

  <div id="codestep" style="display:none">
    <input id="codein" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters"
           inputmode="text" style="text-align:center;letter-spacing:10px;font-size:34px;color:var(--gold);padding:20px">
    <div class="sub" style="margin:8px 0 14px;font-size:11px">4 characters &middot; it's on the big screen</div>
    <button id="codego">CONTINUE</button>
    <div class="sub err" id="codeerr"></div>
  </div>

  <div id="form">
    <input id="name" placeholder="Team name…" maxlength="14" autocomplete="off">
    <div class="sub" id="namehint" style="margin:8px 0 14px;font-size:11px">up to 14 characters &middot; it goes on the big screen</div>
    <button id="join">JOIN</button>
    <div class="sub err" id="err"></div>
  </div>

  <div id="return" style="display:none">
    <div class="ok" style="margin-top:0">✓ Welcome back</div>
    <div class="backname" id="backname"></div>
    <button id="resume">BACK TO THE GAME</button>
    <div class="sub" style="text-align:center;margin-top:16px">
      <a href="#" id="notme">not you? join as a new team</a>
    </div>
  </div>

  <div id="done" style="display:none">
    <div class="ok">✓ You're in!<br>Waiting for the host to start…</div>
  </div>

  <script src="supabase.js"></script>   <!-- Supabase LOKALNIE (MIT) — bez obcego CDN -->
  <script>
    // ===== CONFIG (same three lines in host / join / display) =====
    const SUPABASE_URL = "https://wrvbpxeuadalnflfygtk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_DGcYVJ4eJWbrqmNSgyRQtA_49yrqbnp";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // ===== helpers =====
    function qp(n){ return new URLSearchParams(location.search).get(n); }
    function safe(t){ const d=document.createElement("div"); d.textContent = t==null ? "" : String(t); return d.innerHTML; }

    const code = (qp("room") || "").toUpperCase();
    let room = null;

    document.getElementById("roomline").innerHTML =
      code ? ('ROOM <span class="code">' + safe(code) + '</span>') : "Enter the code from the big screen";

    // BEZ KODU W LINKU (ktos wpisal adres recznie, bo nie moze zeskanowac QR):
    // pokazujemy pole na kod. Wczesniej byl tu SLEPY ZAULEK — komunikat i nic wiecej.
    if (!code){
      document.getElementById("form").style.display = "none";
      document.getElementById("codestep").style.display = "block";
      const ci = document.getElementById("codein");
      setTimeout(function(){ try { ci.focus(); } catch(e){} }, 150);
      ci.addEventListener("input", function(){
        this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
        document.getElementById("codeerr").textContent = "";
      });
      ci.addEventListener("keydown", function(e){
        if (e.key === "Enter") document.getElementById("codego").click();
      });
      document.getElementById("codego").onclick = async function(){
        const v = (ci.value || "").trim().toUpperCase();
        const errEl = document.getElementById("codeerr");
        if (v.length < 4){ errEl.textContent = "Enter all 4 characters."; return; }
        const btn = this, label = btn.textContent;
        btn.disabled = true; btn.textContent = "CHECKING\u2026";
        // SPRAWDZAMY OD RAZU — zeby nikt nie wpisywal nazwy druzyny do nieistniejacego pokoju
        let found = null;
        try {
          const res = await db.from("rooms").select("id").eq("code", v).maybeSingle();
          found = res.data;
        } catch(e){ found = null; }
        btn.disabled = false; btn.textContent = label;
        if (!found){ errEl.textContent = "No game with that code. Check the big screen."; return; }
        // ten sam adres co po skanie QR — dalej wszystko idzie utarta sciezka
        location.href = "join.html?room=" + encodeURIComponent(v);
      };
    }

    // ===== POWROT PRZEZ QR =====
    // Tozsamosc zapisana przy pierwszym JOIN siedzi w localStorage.
    // Decyzje "powrot czy nowy" podejmujemy NATYCHMIAST po kodzie z linku
    // (synchronicznie, bez sieci) — zero migania, odporne na slabe wifi.
    // Baza potem tylko POTWIERDZA po room.id (kod moze sie kiedys powtorzyc miedzy wieczorami).
    const savedTeamId   = localStorage.getItem("fl_team_id");
    const savedRoomCode = (localStorage.getItem("fl_room_code") || "").toUpperCase();
    const savedRoomId   = localStorage.getItem("fl_room_id");
    const savedName     = localStorage.getItem("fl_team_name");

    let returning = false;

    function showReturn(){
      document.getElementById("backname").textContent = savedName || "your team";
      document.getElementById("form").style.display   = "none";
      document.getElementById("return").style.display = "block";
    }
    function showForm(){
      document.getElementById("return").style.display = "none";
      document.getElementById("form").style.display   = "block";
    }

    if (code && savedTeamId && savedRoomCode && savedRoomCode === code){
      returning = true;
      showReturn();
    }

    // przycisk powrotu — ZADNEGO insertu do teams, tozsamosc juz jest w localStorage;
    // player.html czyta ja i wraca dokladnie tam, gdzie gracz byl.
    document.getElementById("resume").onclick = function(){
      location.href = "player.html?room=" + code;
    };
    // "to nie ja" — chowamy panel powrotu, zwykly JOIN nadpisze stara tozsamosc nowa.
    document.getElementById("notme").onclick = function(e){
      e.preventDefault();
      returning = false;
      showForm();
    };

    (async function(){
      if (!code) return;
      let data = null;
      try {
        const res = await db.from("rooms").select("*").eq("code", code).single();
        data = res.data;
      } catch(e){ data = null; }
      if (!data){
        // brak odpowiedzi (padle wifi) LUB pokoj nie istnieje:
        // NOWEMU graczowi pokazujemy blad; WRACAJACEMU nie ruszamy panelu,
        // zeby chwilowy brak sieci nie odcial go od powrotu do gry.
        if (!returning) document.getElementById("err").textContent = "Room not found. Check the code.";
        return;
      }
      room = data;
      // Pewnosc po room.id: kod sie zgadzal, ale to INNY odpalony pokoj (inny UUID) →
      // ten gosc jest tak naprawde nowym graczem, przelaczamy na formularz.
      if (returning && String(savedRoomId) !== String(room.id)){
        returning = false;
        showForm();
      }
      // NEW NIGHT reset: pokoj TEN SAM, ale druzyna mogla zostac SKASOWANA -> sprawdz czy jeszcze istnieje.
      // Bez tego telefon witalby "welcome back" i wracal do nieistniejacej druzyny (rozjazd stanu).
      if (returning){
        try {
          const { data: team, error } = await db.from("teams").select("id").eq("id", savedTeamId).maybeSingle();
          if (!error && !team){   // DEFINITYWNIE nie ma (nie blad sieci) -> traktuj jak NOWEGO gracza
            returning = false;
            localStorage.removeItem("fl_team_id");
            localStorage.removeItem("fl_team_token");
            localStorage.removeItem("fl_team_name");
            showForm();
          }
        } catch(e){ /* blad sieci — NIE ruszaj wracajacego (odporne na slabe wifi) */ }
      }
    })();

    // licznik znakow na zywo — gracz widzi limit, nie tylko go czuje
    (function(){
      const inp = document.getElementById("name"), hint = document.getElementById("namehint");
      if (!inp || !hint) return;
      const LIMIT = 14;
      inp.addEventListener("input", function(){
        const zostalo = LIMIT - inp.value.length;
        hint.textContent = zostalo > 0
          ? zostalo + " character" + (zostalo===1?"":"s") + " left"
          : "that's the limit \u2014 14 characters";
        hint.style.color = zostalo > 0 ? "" : "var(--gold)";
      });
    })();

    document.getElementById("join").onclick = async function(){
      const name = document.getElementById("name").value.trim();
      if (!name){ document.getElementById("err").textContent = "Enter a team name."; return; }
      if (!room){ document.getElementById("err").textContent = "Room not ready yet — try again."; return; }
      // BLOKADA DUPLIKATU: dwie druzyny o tej samej nazwie sa nie do rozroznienia na TV.
      // Sprawdzamy BEZ wielkosci liter i bez spacji na koncach ("Reds" == "reds " == "REDS").
      const btnJoin = document.getElementById("join");
      const label = btnJoin.textContent;
      btnJoin.disabled = true; btnJoin.textContent = "CHECKING\u2026";
      try {
        const { data: taken, error: cErr } = await db.from("teams").select("name").eq("room_id", room.id);
        if (!cErr && Array.isArray(taken)){
          const norm = name.toLowerCase();
          const clash = taken.some(function(t){ return (t.name||"").trim().toLowerCase() === norm; });
          if (clash){
            document.getElementById("err").textContent = "That name is already taken tonight \u2014 pick another one.";
            btnJoin.disabled = false; btnJoin.textContent = label;
            return;
          }
        }
      } catch(e){}
      btnJoin.disabled = false; btnJoin.textContent = label;
      const { data, error } = await db.from("teams").insert({ room_id: room.id, name: name, role: "team" }).select().single();
      if (error){ document.getElementById("err").textContent = error.message; return; }
      localStorage.setItem("fl_team_id", data.id);
      localStorage.setItem("fl_team_token", data.token || "");   // sekret drużyny (RLS: telefon edytuje tylko swój wpis)
      localStorage.setItem("fl_room_id", room.id);
      localStorage.setItem("fl_team_name", name);
      localStorage.setItem("fl_room_code", code);
      // auto-przejscie do ekranu gracza (czekanie -> draft)
      location.href = "player.html?room=" + code;
    };
  </script>
</body>
</html>
